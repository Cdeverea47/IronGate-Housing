services:
  - type: web
    name: irongate-housing
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://irongate-housing.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
        git add render.yaml
git commit -m "Fix render.yaml for free plan"
git push
